trigger:
  branches:
    include:
      - main

pool:
  name: Default

variables:
  pythonVersion: '3.10'

steps:
  # ----------------------------
  # Checkout
  # ----------------------------
  - checkout: self
    clean: true

  # ----------------------------
  # Run unit tests with pytest
  # ----------------------------
  - script: |
      source /Users/ctac/Library/Caches/pypoetry/virtualenvs/my-sbit-project-eXtul0LL-py3.11/bin/activate
      pytest --junitxml=pytest_results.xml --cov=. --cov-report=xml --maxfail=1 -q
    displayName: 'Run PySpark unit tests'

  # ----------------------------
  # Publish test results
  # ----------------------------
  - task: PublishTestResults@2
    inputs:
      testResultsFiles: '**/pytest_results.xml'
      mergeTestResults: true
    condition: succeededOrFailed()
    displayName: 'Publish pytest test results'