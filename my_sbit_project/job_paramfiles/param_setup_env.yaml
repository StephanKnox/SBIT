job_config:
  tasks:
    create_db:
      sql_query: >
        CREATE DATABASE IF NOT EXISTS IDENTIFIER(:catalog || '.' || 'sbit_db')

    create_tbl_registered_users_bz:
      sql_query: >
        CREATE TABLE IF NOT EXISTS IDENTIFIER(:catalog || '.sbit_db.' ||   'registered_users_bz')(
                    user_id long,
                    device_id long, 
                    mac_address string, 
                    registration_timestamp double,
                    load_time timestamp,
                    source_file string)

    create_gym_logins_bz:
      sql_query: >
        CREATE OR REPLACE TABLE IDENTIFIER(:catalog || '.sbit_db.' ||   'gym_logins_bz')(
                    mac_address string,
                    gym bigint,
                    login double,                      
                    logout double,                    
                    load_time timestamp,
                    source_file string)

    create_kafka_multiplex_bz:
      sql_query: >
        CREATE TABLE IF NOT EXISTS IDENTIFIER(:catalog || '.sbit_db.' ||   'kafka_multiplex_bz')(
                  key string, 
                  value string, 
                  topic string, 
                  partition bigint, 
                  offset bigint, 
                  timestamp bigint,                  
                  date date, 
                  week_part string,                  
                  load_time timestamp,
                  source_file string)
                  PARTITIONED BY (topic, week_part)

    create_users:
      sql_query: >
        CREATE OR REPLACE TABLE IDENTIFIER(:catalog || '.sbit_db.' ||   'users')(
                    user_id bigint, 
                    device_id bigint, 
                    mac_address string,
                    registration_timestamp timestamp)

    create_gym_logs:
      sql_query: >
        CREATE OR REPLACE TABLE IDENTIFIER(:catalog || '.sbit_db.' ||   'gym_logs')(
                    mac_address string,
                    gym bigint,
                    login timestamp,                      
                    logout timestamp)

    create_user_profile:
      sql_query: >
        CREATE TABLE IF NOT EXISTS IDENTIFIER(:catalog || '.sbit_db.' ||   'user_profile')(
                    user_id bigint, 
                    dob DATE, 
                    sex STRING, 
                    gender STRING, 
                    first_name STRING, 
                    last_name STRING, 
                    street_address STRING, 
                    city STRING, 
                    state STRING, 
                    zip INT, 
                    updated TIMESTAMP)

    create_heart_rate:
      sql_query: >
       CREATE TABLE IF NOT EXISTS IDENTIFIER(:catalog || '.sbit_db.' ||   'heart_rate')(
                    device_id LONG, 
                    time TIMESTAMP, 
                    heartrate DOUBLE, 
                    valid BOOLEAN)

    create_user_bins:
      sql_query: >
        CREATE TABLE IF NOT EXISTS IDENTIFIER(:catalog || '.sbit_db.' ||   'user_bins')(
                    user_id BIGINT, 
                    age STRING, 
                    gender STRING, 
                    city STRING, 
                    state STRING)

    create_workouts:
      sql_query: >
        CREATE TABLE IF NOT EXISTS IDENTIFIER(:catalog || '.sbit_db.' ||   'workouts')(
                    user_id INT, 
                    workout_id INT, 
                    time TIMESTAMP, 
                    action STRING, 
                    session_id INT)

    create_completed_workouts:
      sql_query: >
        CREATE TABLE IF NOT EXISTS IDENTIFIER(:catalog || '.sbit_db.' ||   'completed_workouts')(
                    user_id INT, 
                    workout_id INT, 
                    session_id INT, 
                    start_time TIMESTAMP, 
                    end_time TIMESTAMP)

    create_workout_bpm:
      sql_query: >
        CREATE TABLE IF NOT EXISTS IDENTIFIER(:catalog || '.sbit_db.' ||   'workout_bpm')(
                    user_id INT, 
                    workout_id INT, 
                    session_id INT,
                    start_time TIMESTAMP, 
                    end_time TIMESTAMP,
                    time TIMESTAMP, 
                    heartrate DOUBLE)

    create_date_lookup:
      sql_query: >
        CREATE TABLE IF NOT EXISTS IDENTIFIER(:catalog || '.sbit_db.' ||   'date_lookup')(
                    date date, 
                    week int, 
                    year int, 
                    month int, 
                    dayofweek int, 
                    dayofmonth int, 
                    dayofyear int, 
                    week_part string)

    create_workout_bpm_summary:
      sql_query: >
        CREATE TABLE IF NOT EXISTS IDENTIFIER(:catalog || '.sbit_db.' ||   'workout_bpm_summary')(
                    workout_id INT, 
                    session_id INT, 
                    user_id BIGINT, 
                    age STRING, 
                    gender STRING, 
                    city STRING, 
                    state STRING, 
                    min_bpm DOUBLE, 
                    avg_bpm DOUBLE, 
                    max_bpm DOUBLE, 
                    num_recordings BIGINT)

    use_db:
      sql_query: >
        USE IDENTIFIER(:catalog || '.' || 'sbit_db')
        
    create_gym_summary:
      sql_query: >
        CREATE OR REPLACE VIEW IDENTIFIER(:catalog || '.sbit_db.' ||   'gym_summary') AS
            SELECT to_date(login::timestamp) date,
                gym, l.mac_address, workout_id, session_id, 
                round((logout::long - login::long)/60,2) minutes_in_gym,
                round((end_time::long - start_time::long)/60,2) minutes_exercising
            FROM sbit_db.gym_logs l 
            JOIN (
                  SELECT mac_address, workout_id, session_id, start_time, end_time
                  FROM sbit_db.completed_workouts w
                  INNER JOIN users u
                  ON w.user_id = u.user_id) w
            ON l.mac_address = w.mac_address 
            AND w. start_time BETWEEN l.login AND l.logout
            order by date, gym, l.mac_address, session_id
