job_config:
  source:
    path: "sbit_db.kafka_multiplex_bz"
    filter: "topic = 'workout'"
    options:
      skipChangedCommits: "true"
    watermark: 
      delay: "30 seconds"
      event_time: "time"
  sink:
    target: "sbit_db.workouts"
    trigger:
      availableNow: true
    options:
      checkpointLocation: "/Volumes/dev/param/checkpoint/UpserterGymLogins"
  params:
    merge:
      merge_condition: "target.mac_address = source.mac_address AND target.gym = source.gym AND target.login = source.login" 
    deduplication:
      unique_cols: user_id, time
      tiebreaker_cols: timestamp
