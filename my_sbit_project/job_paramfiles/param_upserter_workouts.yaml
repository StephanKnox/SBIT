job_config:
  source:
    path: "sbit_db.kafka_multiplex_bz"
    filter: "topic = 'workout'"
    options:
      skipChangedCommits: "true"
    watermark: 
      delay: "30 seconds"
      event_time: "timestamp"
  sink:
    target: "sbit_db.workouts"
    trigger:
      availableNow: true
    options:
      checkpointLocation: "/Volumes/dev/param/checkpoint/UpserterWorkouts"
  params:
    merge:
      merge_condition: "target.user_id = source.user_id AND target.time = source.time" 
    deduplication:
      unique_cols: user_id, action, timestamp
      tiebreaker_cols: timestamp
