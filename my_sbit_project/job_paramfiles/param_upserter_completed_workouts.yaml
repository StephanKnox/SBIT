job_config:
  source:
    path: "sbit_db.workouts"
    filter: "action = 'start'"
    options:
      skipChangedCommits: "true"
    watermark: 
      delay: "30 seconds"
      event_time: "time"
  sink:
    target: "sbit_db.completed_workouts"
    trigger:
      availableNow: true
    options:
      checkpointLocation: "/Volumes/dev/param/checkpoint/UpserterCompletedWorkouts"
  params:
    merge:
      merge_condition: "target.user_id = source.user_id AND target.workout_id = source.workout_id AND target.session_id = source.session_id"
