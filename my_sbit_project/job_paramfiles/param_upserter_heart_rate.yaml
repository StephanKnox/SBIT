job_config:
  source:
    path: "sbit_db.kafka_multiplex_bz"
    filter: "topic = 'bpm'"
    options:
      skipChangedCommits: "true"
    watermark: 
      delay: "30 seconds"
      event_time: "time"
  sink:
    target: "sbit_db.heart_rate"
    trigger:
      availableNow: true
    options:
      checkpointLocation: "/Volumes/dev/param/checkpoint/UpserterHeartRate"
  params:
    merge:
      merge_condition: "target.device_id = source.device_id AND target.time = source.time"
    deduplication:
      unique_cols: device_id, time
  logging:
    min_level: "INFO"
    handlers:
      - "console"
      - "delta_table"
    options:
      delta_table: "sbit_db.job_logs"
