job_config:
  source:
    path: "/Volumes/dev/param/data_zone/kafka_multiplex_bz"
    options:
      cloudFiles.format: "json"
  sink:
    target: "sbit_db.kafka_multiplex_bz"
    trigger:
      availableNow: true
    options:
      checkpointLocation: "/Volumes/dev/param/checkpoint/ConsumerKafkaMultiplex"
  
  logging:
    min_level: "INFO"
    handlers:
      - "console"
      - "delta_table"
    options:
      delta_table: "sbit_db.job_logs"
