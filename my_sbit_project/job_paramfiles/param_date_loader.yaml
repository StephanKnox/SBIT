job_config:
  source:
    path: "/Volumes/dev/param/data_zone/history/6-date-lookup.json"
    options:
      cloudFiles.format: "json"
  sink:
    target: "sbit_db.date_lookup"
    trigger:
      availableNow: true
    options:
      checkpointLocation: "/Volumes/dev/param/checkpoint/DataLoader"
  params:
    merge:
      merge_condition: "target.col1 = source.col1 and target.col2 = source.col2"
    deduplication:
      unique_cols: col1, col2
      tiebreaker_cols: mytimestamp
